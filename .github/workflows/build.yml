name: Build extension ZIP
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          mkdir -p dist
          zip -r dist/pc-mouse-minimal.zip manifest.json popup.html popup.css popup.js src README.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-mouse-minimal
          path: dist/pc-mouse-minimal.zip
